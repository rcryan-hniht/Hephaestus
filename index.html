const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

function glass(back){return new THREE.ShaderMaterial({vertexShader,fragmentShader,side:back?THREE.BackSide:THREE.FrontSide,uniforms:{uTexture:{value:back?rtBack.texture:rtFront.texture},uResolution:{value:new THREE.Vector2(1,1)},uIorR:{value:1.15},uIorY:{value:1.16},uIorG:{value:1.18},uIorC:{value:1.22},uIorB:{value:1.22},uIorP:{value:1.22},uRefractPower:{value:back?.22:.30},uChromatic:{value:.5},uSaturation:{value:1.08},uShininess:{value:90},uDiffuseness:{value:.02},uFresnelPower:{value:5},uLight:{value:new THREE.Vector3(-1,1,1)},uBackside:{value:back?1:0}}});}

function drawHeadline(W,H,dpr,mobile){headline.width=Math.round(W*dpr);headline.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);let fs=Math.min(H*.21,W*(mobile?.21:.118));const lines=['Explore','New','Ideas'];ctx.font=`800 ${fs}px Poppins`;const widest=Math.max(...lines.map(line=>ctx.measureText(line).width));fs*=Math.min(1,W*(mobile?.9:.5)/widest);ctx.font=`800 ${fs}px Poppins`;ctx.fillStyle='#e9e9e9';ctx.textAlign='center';ctx.textBaseline='alphabetic';const cx=W*(mobile?.5:.505),cy=H*(mobile?.45:.468);lines.forEach((line,i)=>ctx.fillText(line,cx,cy+fs*.7/2+(i-1)*fs*1.07));texture.needsUpdate=true;}
function layout(){const W=hero.clientWidth,H=hero.clientHeight,dpr=Math.min(devicePixelRatio,2),mobile=W<768||W/H<1;renderer.setPixelRatio(dpr);renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();const size=renderer.getDrawingBufferSize(new THREE.Vector2());rtBack.setSize(size.x,size.y);rtFront.setSize(size.x,size.y);backMat.uniforms.uResolution.value.copy(size);frontMat.uniforms.uResolution.value.copy(size);const visH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*10,visW=visH*camera.aspect;pivot.position.set(((mobile?.5:.517)-.5)*visW,(.5-(mobile?.45:.488))*visH,0);pivot.scale.setScalar(Math.min(H*.44,W*(mobile?.45:.29))/H*visH);drawHeadline(W,H,dpr,mobile);}
function installGeometry(g){g.computeBoundingBox();const size=g.boundingBox.getSize(new THREE.Vector3());g.center();g.scale(...Array(3).fill(1/Math.max(size.x,size.y,size.z)));cube=new THREE.Mesh(g,frontMat);spinner.add(cube);layout();loader.classList.add('done');loader.textContent='Model ready';}
new GLTFLoader().load(MODEL_URL,gltf=>{const parts=[];try{gltf.scene.updateMatrixWorld(true);gltf.scene.traverse(mesh=>{if(!mesh.isMesh)return;let g=mesh.geometry.clone();for(const attr of ['uv','color','tangent'])g.deleteAttribute(attr);const merged=mergeVertices(g,1e-4);g.dispose();g=merged;g.computeVertexNormals();g.applyMatrix4(mesh.matrixWorld);parts.push(g);});const g=mergeGeometries(parts);if(!g)throw new Error('Model geometry could not be merged');installGeometry(g);}catch(error){console.warn(error);installGeometry(new RoundedBoxGeometry(1,1,1,8,.12));}finally{parts.forEach(g=>g.dispose());gltf.scene.traverse(mesh=>{if(mesh.isMesh){mesh.geometry.dispose();const materials=Array.isArray(mesh.material)?mesh.material:[mesh.material];materials.forEach(m=>{for(const value of Object.values(m))if(value?.isTexture)value.dispose();m.dispose();});}});}},undefined,()=>installGeometry(new RoundedBoxGeometry(1,1,1,8,.12)));
const axisX=new THREE.Vector3(1,0,0),axisY=new THREE.Vector3(0,1,0),q=new THREE.Quaternion();
function rotate(dx,dy){spinner.quaternion.premultiply(q.setFromAxisAngle(axisY,dx));spinner.quaternion.premultiply(q.setFromAxisAngle(axisX,dy));}
let dragging=false,pointerId=null,lastX=0,lastY=0,lastMove=0,release=-1600,vx=0,vy=0,remaining=0;
canvas.addEventListener('pointerdown',e=>{if(pointerId!==null)return;dragging=true;pointerId=e.pointerId;lastX=e.clientX;lastY=e.clientY;lastMove=performance.now();vx=vy=remaining=0;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});

function endDrag(e){if(e.pointerId!==pointerId)return;dragging=false;pointerId=null;release=performance.now();if(release-lastMove>100||reduced.matches)vx=vy=0;canvas.classList.remove('dragging');if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);canvas.addEventListener('lostpointercapture',endDrag);
function turn(direction){vx=vy=0;release=performance.now();remaining=direction*Math.PI/2;if(reduced.matches){rotate(remaining,0);remaining=0;}}
document.querySelector('#prev').addEventListener('click',()=>turn(-1));document.querySelector('#next').addEventListener('click',()=>turn(1));
const dots=[...document.querySelectorAll('.dot')];dots.forEach(dot=>dot.addEventListener('click',()=>dots.forEach(item=>{const active=item===dot;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active));})));
let frame=0,previous=0,disposed=false;

renderer.autoClear=true;renderer.setRenderTarget(rtBack);renderer.render(bgScene,bgCamera);renderer.setRenderTarget(rtFront);renderer.render(bgScene,bgCamera);if(cube){renderer.autoClear=false;cube.material=backMat;renderer.render(scene,camera);}renderer.autoClear=true;renderer.setRenderTarget(null);renderer.render(bgScene,bgCamera);if(cube){renderer.autoClear=false;renderer.clearDepth();cube.material=frontMat;renderer.render(scene,camera);}}

await Promise.race([Promise.all([document.fonts.load('800 100px Poppins'),document.fonts.ready]),new Promise(resolve=>setTimeout(resolve,2500))]);layout();frame=requestAnimationFrame(loop);
