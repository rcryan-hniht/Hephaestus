services:
  - type: web
    name: hephaestus-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend
