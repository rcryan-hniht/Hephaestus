services:
  - type: web
    name: hephaestus-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: HEPHAESTUS_CORS_ORIGINS
        sync: false
    # Free Render filesystems are ephemeral. Use local Docker's named volume
    # for persistent experiments; add a persistent disk before hosted persistence.
