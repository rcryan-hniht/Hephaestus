<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hephaestus — every angle of the building, before it's built</title>
    <meta name="description" content="An interactive 3D architecture visualizer. Walk a toon-shaded study model from any angle before anything is built." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='18' width='24' height='10' fill='%23907AA9'/%3E%3Crect x='10' y='10' width='12' height='8' fill='%23286983'/%3E%3Crect x='13' y='4' width='6' height='6' fill='%23EB6F92'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Caveat:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="frame">
      <!-- corner marks -->
      <div class="corner corner--tl mono" aria-hidden="true">x 128 · y 064</div>
      <a class="corner corner--tr mono" href="mailto:studio@hephaestus.dev">studio@hephaestus.dev</a>

      <nav class="nav" aria-label="Main">
        <a class="nav__logo" href="#" aria-label="Hephaestus home">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <rect x="2" y="13" width="20" height="8" fill="#907AA9"/>
            <rect x="8" y="7" width="8" height="6" fill="#286983"/>
            <rect x="10" y="2" width="4" height="5" fill="#EB6F92"/>
          </svg>
          <span>Hephaestus</span>
        </a>
        <div class="nav__links">
          <a href="#scene">Sketches</a>
          <a href="#scene">Structure</a>
          <a href="mailto:studio@hephaestus.dev">Contact</a>
        </div>
        <button class="nav__cta" type="button" data-open-scene>Open the model</button>
      </nav>

      <header class="hero">
        <h1 class="hero__title">
          <span class="hero__line">Every angle of the building,</span>
          <span class="hero__line">before it's built.</span>
        </h1>
        <span class="hero__note hero__note--a" aria-hidden="true">walk the site
          <svg viewBox="0 0 60 30" aria-hidden="true"><path d="M2 4 C 30 8, 44 10, 54 24" fill="none" stroke="#797593" stroke-width="1.2"/><path d="M48 22 l7 2 -3 -7" fill="none" stroke="#797593" stroke-width="1.2"/></svg>
        </span>
        <span class="hero__note hero__note--b" aria-hidden="true">not a render, a model
          <svg viewBox="0 0 70 34" aria-hidden="true"><path d="M4 6 C 34 2, 52 12, 62 26" fill="none" stroke="#797593" stroke-width="1.2"/><path d="M56 25 l7 1 -3 -7" fill="none" stroke="#797593" stroke-width="1.2"/></svg>
        </span>
      </header>

      <main id="scene" class="stage">
        <div class="stage__inner">
          <canvas id="canvas" aria-label="Interactive 3D architecture model. Left-drag to orbit, scroll to zoom." role="img"></canvas>

          <button class="stage__thumb" type="button" data-open-scene aria-label="Expand the building model">
            <span class="stage__thumb-box"></span>
            <span class="stage__thumb-label">click to open</span>
          </button>

          <div class="stage__caption mono" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 8h12M11 5l3 3-3 3M10 2v3M6 2v3" stroke="#797593" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
            <span id="caption-text">a study model in Rosé Pine</span>
          </div>
        </div>
      </main>

      <footer class="foot mono">
        <span aria-hidden="true">51.5072° N — the studio sketchbook</span>
        <a class="foot__mail" href="mailto:studio@hephaestus.dev">studio@hephaestus.dev</a>
        <span aria-hidden="true">colors by Rosé Pine</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
