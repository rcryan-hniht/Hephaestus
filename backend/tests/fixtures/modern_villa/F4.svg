<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1840" viewBox="0 0 1400 1840">
  <title>Modern Villa V2 / F4</title>
  <desc>Synthetic stepped villa input. Three storeys, terraces, a recessed roof pavilion and a raised thin roof canopy. Internal stair flights and landings connect all four supplied floors. Component heights require explicit preset confirmation. Glazing is omitted.</desc>
  <rect width="1400" height="1840" fill="#fafafa" />
  <text x="140" y="62" fill="#666" font-family="Arial, sans-serif" font-size="20" text-anchor="start">HEPHAESTUS / MODERN VILLA V2 / SYNTHETIC INPUT</text>
  <text x="140" y="110" fill="#333" font-family="Arial, sans-serif" font-size="30" text-anchor="start">F4 / ROOF TERRACE / PAVILION / CANOPY</text>
  <text x="140" y="151" fill="#666" font-family="Arial, sans-serif" font-size="20" text-anchor="start">10.00 m x 14.00 m design envelope / common source coordinates</text>
  <g id="Floor-4" class="Floorplan" transform="translate(140 240)">
    <g id="F4-facade-1" class="Wall Facade">
      <polygon points="430.000,430.000 430.000,910.000 450.000,910.000 450.000,890.000 450.000,450.000 450.000,430.000" fill="#e8e4dc" stroke="#333" stroke-width="1" />
    </g>
    <g id="F4-facade-2" class="Wall Facade">
      <polygon points="450.000,910.000 790.000,910.000 790.000,430.000 450.000,430.000 450.000,450.000 770.000,450.000 770.000,890.000 450.000,890.000" fill="#e8e4dc" stroke="#333" stroke-width="1" />
    </g>
    <g id="F4-parapet-1" class="Wall Terrace_Parapet">
      <polygon points="180.000,200.000 180.000,1100.000 200.000,1100.000 200.000,1080.000 200.000,220.000 200.000,200.000" fill="#e8e4dc" stroke="#333" stroke-width="1" />
    </g>
    <g id="F4-parapet-2" class="Wall Terrace_Parapet">
      <polygon points="200.000,1100.000 900.000,1100.000 900.000,200.000 200.000,200.000 200.000,220.000 880.000,220.000 880.000,1080.000 200.000,1080.000" fill="#e8e4dc" stroke="#333" stroke-width="1" />
    </g>
    <g id="F4-interior-slab-1" class="Space Interior">
      <polygon points="450.000,890.000 530.000,890.000 530.000,850.000 530.000,600.000 530.000,450.000 450.000,450.000" fill="#f4f0e8" stroke="#dad5cb" stroke-width="1" />
    </g>
    <g id="F4-interior-slab-2" class="Space Interior">
      <polygon points="770.000,890.000 770.000,450.000 730.000,450.000 730.000,600.000 730.000,785.000 730.000,850.000 530.000,850.000 530.000,890.000" fill="#f4f0e8" stroke="#dad5cb" stroke-width="1" />
    </g>
    <g id="F4-terrace-slab-1" class="Space Outdoor_Terrace">
      <polygon points="200.000,1080.000 430.000,1080.000 430.000,910.000 430.000,430.000 430.000,220.000 200.000,220.000" fill="#f4f0e8" stroke="#dad5cb" stroke-width="1" />
    </g>
    <g id="F4-terrace-slab-2" class="Space Outdoor_Terrace">
      <polygon points="430.000,1080.000 880.000,1080.000 880.000,220.000 430.000,220.000 430.000,430.000 450.000,430.000 790.000,430.000 790.000,910.000 450.000,910.000 430.000,910.000" fill="#f4f0e8" stroke="#dad5cb" stroke-width="1" />
    </g>
