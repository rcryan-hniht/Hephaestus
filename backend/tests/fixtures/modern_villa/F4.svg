      <polygon points="770.000,430.000 770.000,450.000 450.000,450.000 450.000,430.000" fill="#dce7e8" stroke="#40575d" stroke-width="1" />
    </g>
    <g id="F4-pavilion-front" class="Window Opening">
      <polygon points="580.000,890.000 580.000,910.000 450.000,910.000 450.000,890.000" fill="#dce7e8" stroke="#40575d" stroke-width="1" />
    </g>
    <g id="F4-pavilion-west" class="Window Opening">
      <polygon points="450.000,480.000 450.000,860.000 430.000,860.000 430.000,480.000" fill="#dce7e8" stroke="#40575d" stroke-width="1" />
    </g>
    <g id="F4-pavilion-east" class="Window Opening">
      <polygon points="790.000,480.000 790.000,860.000 770.000,860.000 770.000,480.000" fill="#dce7e8" stroke="#40575d" stroke-width="1" />
    </g>
    <g class="Annotation" fill="none" stroke="#888">
      <rect x="370" y="370" width="480" height="600" stroke="#b8926a" stroke-width="3" stroke-dasharray="10 5" />
    </g>
    <text x="682" y="420" fill="#666" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">STAIR VOID / BELOW</text>
    <text x="610" y="535" fill="#333" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">ROOF PAVILION</text>
    <text x="275" y="530" fill="#333" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">TERRACE</text>
    <text x="690" y="1035" fill="#333" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">TERRACE</text>
    <text x="610" y="340" fill="#9b7448" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">CANOPY ABOVE / TOP +13.20 m</text>
    <text x="520" y="-24" fill="#666" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Terrace parapets: 1.10 m</text>
  </g>
  <text x="140" y="1708" fill="#666" font-family="Arial, sans-serif" font-size="20" text-anchor="start">Scale: 100 SVG units = 1.00 m / confirm 0.01 meters per source unit</text>
  <text x="140" y="1748" fill="#666" font-family="Arial, sans-serif" font-size="20" text-anchor="start">Floor height: 3.00 m / slab: 0.20 m / offsets X and Y: zero</text>
  <text x="140" y="1788" fill="#666" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Use the Villa V2 preset for low parapets and the elevated roof canopy; confirm before building.</text>
</svg>
