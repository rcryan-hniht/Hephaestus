<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1960" viewBox="0 0 1720 1960">
  <title>Terrace Villa / F1 / synthetic drawing</title>
  <desc>Synthetic stepped villa: lower garage, two living floors, terrace parapets, shallow shed roofs and internal stairs connecting all three floors. Review suggested roof rise, thickness and stair dimensions. Planting, finishes and glazing are omitted. All dimensions and heights are editable design suggestions. Confirm before reconstruction.</desc>
  <rect width="1720" height="1960" fill="#fafafa" />
  <text x="140" y="60" fill="#333" font-family="Arial, sans-serif" font-size="22">HEPHAESTUS / SYNTHETIC DRAWING PRESET</text>
  <text x="140" y="105" fill="#333" font-family="Arial, sans-serif" font-size="30">TERRACE VILLA / F1</text>
  <text x="140" y="145" fill="#333" font-family="Arial, sans-serif" font-size="19">Suggested floor height 3.2 m / source scale 0.01 m per unit / review before building</text>
  <g id="Floor-1" class="Floorplan">
    <g id="F1-front-facade-1" class="Wall Front_facade">
      <polygon points="790.000,850.000 1430.000,850.000 1430.000,870.000 790.000,870.000" fill="#e8e4dc" stroke="#333" stroke-width="1" />
    </g>
    <g id="F1-interior-partition-2" class="Wall Interior_partition">
      <polygon points="810.000,1301.800 810.000,1316.800 1160.000,1316.800 1160.000,1301.800" fill="#e8e4dc" stroke="#333" stroke-width="1" />
      <polygon points="1410.000,1316.800 1410.000,1301.800 1320.000,1301.800 1320.000,1316.800" fill="#e8e4dc" stroke="#333" stroke-width="1" />
    </g>
    <g id="F1-interior-door-3" class="Door Interior_door">
      <polygon points="1050.000,1301.800 1050.000,1316.800 960.000,1316.800 960.000,1301.800" fill="#c45c3d" stroke="#333" stroke-width="1" />
    </g>
    <g id="F1-rear-room-4" class="Space Rear_room">
      <polygon points="810.000,1316.800 1410.000,1316.800 1410.000,1720.000 810.000,1720.000" fill="#f4f0e8" stroke="#333" stroke-width="1" />
    </g>
    <g id="F1-living-room-5" class="Space Living_room">
      <polygon points="810.000,880.000 1410.000,880.000 1410.000,1301.800 810.000,1301.800" fill="#f4f0e8" stroke="#333" stroke-width="1" />
    </g>
    <g id="F1-rear-wall-6" class="Wall Rear_wall">
      <polygon points="790.000,1720.000 1430.000,1720.000 1430.000,1740.000 790.000,1740.000" fill="#e8e4dc" stroke="#333" stroke-width="1" />
    </g>
    <g id="F1-side-wall-7" class="Wall Side_wall">
      <polygon points="790.000,870.000 810.000,870.000 810.000,940.000 310.000,940.000 310.000,1720.000 790.000,1720.000 790.000,1740.000 290.000,1740.000 290.000,920.000 790.000,920.000" fill="#e8e4dc" stroke="#333" stroke-width="1" />
    </g>
    <g id="F1-side-wall-8" class="Wall Side_wall">
      <polygon points="1430.000,1720.000 1410.000,1720.000 1410.000,1316.800 1410.000,1301.800 1410.000,870.000 1430.000,870.000" fill="#e8e4dc" stroke="#333" stroke-width="1" />
    </g>
    <g id="F1-garage-door-9" class="Door Garage_door">
