      <line x1="1180" x2="1300" y1="1251.667" y2="1251.667" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1280.000" y2="1280.000" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1308.333" y2="1308.333" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1336.667" y2="1336.667" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1365.000" y2="1365.000" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1393.333" y2="1393.333" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1421.667" y2="1421.667" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1450.000" y2="1450.000" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1478.333" y2="1478.333" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1506.667" y2="1506.667" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1535.000" y2="1535.000" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1563.333" y2="1563.333" stroke="#666" stroke-width="1" />
      <line x1="1180" x2="1300" y1="1591.667" y2="1591.667" stroke="#666" stroke-width="1" />
      <text x="1240.0" y="1090" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle">18 steps / UP to F2</text>
    </g>
  </g>
  <text x="140" y="1780" fill="#666" font-family="Arial, sans-serif" font-size="18">Synthetic dimensions. Confirm floor and component heights, then confirm alignment.</text>
  <text x="140" y="1820" fill="#666" font-family="Arial, sans-serif" font-size="16">Internal stairs connect F1 to F2 (18 steps) and F2 to F3 (20 steps), with open stairwells.</text>
  <text x="140" y="1844" fill="#666" font-family="Arial, sans-serif" font-size="16">Review suggested roof rise, thickness and stair dimensions before building.</text>
  <text x="140" y="1868" fill="#666" font-family="Arial, sans-serif" font-size="16">Planting, finishes and glazing are omitted.</text>
</svg>
