[project]
name = "hephaestus-backend"
version = "0.1.0"
description = "API for the Hephaestus architecture visualizer"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "defusedxml>=0.7.1",
    "httpx>=0.28",
    "pillow>=11",
    "python-dotenv>=1.1",
    "python-multipart>=0.0.20",
    "shapely>=2.1",
    "ruff>=0.17.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
