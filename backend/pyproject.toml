[project]
name = "hephaestus-backend"
version = "0.1.0"
description = "API for the Hephaestus architecture visualizer"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "defusedxml>=0.7.1",
    "httpx>=0.28",
    "pillow>=11",
    "python-dotenv>=1.1",
    "python-multipart>=0.0.20",
    "shapely>=2.1",
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "gdown>=5.0",
    "ruff>=0.17.0",
    "scikit-image>=0.20",
    "httpx2>=2.13.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
