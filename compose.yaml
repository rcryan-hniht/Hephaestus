services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      HEPHAESTUS_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
volumes:
  backend-data:
